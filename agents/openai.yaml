interface:
  display_name: "视觉语言提取器"
  short_description: "Extract reusable visual DNA from image or video references"
  default_prompt: "Analyze my uploaded reference image or video, isolate the true design canvas, extract actionable visual DNA, and ask for confirmation before generating a reusable template. Keep input roles separate: reference_image is visual-language/layout only; target_image is the sole source of the person's identity and face. Never combine, swap, or use the reference person's face or facial features as a condition. Preserve the target face by pixel-locked compositing; only allow identity-preserving layout operations such as crop and proportional scale. If target_image is missing, analyze only and do not generate a recreated image."
